name: content-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate content
        run: python -m tools.validate_content

      - name: Build dev database (includes drafts)
        run: python -m tools.build_db --include-draft --out build/content-dev.db

      - name: Upload dev database
        uses: actions/upload-artifact@v4
        with:
          name: content-dev-db
          path: build/content-dev.db
